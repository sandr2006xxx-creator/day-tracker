<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>День — Трекер</title>
<style>
  :root {
    --bg: #f7f4ee; --card: #ffffff; --text: #1c1c1c; --muted: #7a7a7a;
    --accent: #d4a853; --border: #eeeae2; --water: #5bb8e8; --water-empty: #eef4f8;
    --radius: 22px; --shadow: 0 4px 20px rgba(0,0,0,.07);
  }
  [data-theme="dark"] {
    --bg: #0d1117; --card: #161b22; --text: #e6edf3; --muted: #8b949e;
    --accent: #f0c14b; --border: #30363d; --water: #4aa3df; --water-empty: #21262d;
    --shadow: 0 4px 20px rgba(0,0,0,.4);
  }
  [data-theme="alpine"] {
    --bg: #f0f5f9; --card: #ffffff; --text: #1a2836; --muted: #5d7284;
    --accent: #7aa3b8; --border: #e1eaf1; --water: #6bb3d1; --water-empty: #e8f1f7;
  }
  [data-theme="cozy"] {
    --bg: #faf6f2; --card: #fffefc; --text: #3a2e26; --muted: #9a8474;
    --accent: #c4a07a; --border: #f0e6dc; --water: #7ab8d0; --water-empty: #f5eee6;
  }
  [data-theme="minimal"] {
    --bg: #0a0a0a; --card: #161616; --text: #fafafa; --muted: #737373;
    --accent: #ffffff; --border: #262626; --water: #3b82f6; --water-empty: #1f1f1f;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:18px; padding-bottom:90px; max-width:480px; margin:0 auto;
    min-height:100vh; transition:background .3s, color .3s;
  }
  .screen { display:none; }
  .screen.active { display:block; }
  h1 { font-size:24px; font-weight:700; margin-bottom:18px; letter-spacing:-.4px; }
  .back {
    display:inline-flex; align-items:center; gap:6px; color:var(--accent);
    font-weight:600; margin-bottom:14px; cursor:pointer; font-size:15px;
  }
  .cards { display:flex; gap:12px; margin-bottom:20px; }
  .stat-card {
    background:var(--card); border-radius:var(--radius); padding:16px 12px;
    box-shadow:var(--shadow); border:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition:transform .2s, box-shadow .2s; position:relative; overflow:hidden;
  }
  .stat-card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background:linear-gradient(90deg, var(--accent), transparent);
    opacity:.6;
  }
  .stat-card.water { flex:1.5; }
  .stat-card.small { flex:1; cursor:pointer; min-height:110px; }
  .stat-card.small:active { transform:scale(.96); }
  .stat-label {
    font-size:11px; color:var(--muted); text-transform:uppercase;
    letter-spacing:1px; margin-bottom:8px; font-weight:700;
  }
  .glasses { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .glass {
    width:24px; height:36px; border:2.5px solid var(--water);
    border-radius:3px 3px 12px 12px; position:relative; overflow:hidden;
    cursor:pointer; background:var(--water-empty); transition:all .2s;
  }
  .glass .fill {
    position:absolute; bottom:0; left:0; right:0; height:0%;
    background:linear-gradient(to top, var(--water) 0%, #a8e0ff 100%);
    transition:height .35s cubic-bezier(.4,0,.2,1);
  }
  .glass.full .fill { height:88%; }
  .glass:active { transform:scale(.88); }
  .sleep-display {
    font-size:36px; font-weight:800; letter-spacing:-1px;
    background:linear-gradient(135deg, var(--text), var(--accent));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .stars-display { font-size:18px; letter-spacing:2px; cursor:pointer; }
  .stars-display span {
    opacity:.25; transition:all .2s; filter:grayscale(1);
  }
  .stars-display span.on {
    opacity:1; filter:grayscale(0); color:#f5b942;
    text-shadow:0 0 8px rgba(245,185,66,.4);
  }
  .section-btn {
    background:var(--card); border-radius:var(--radius); padding:18px;
    margin-bottom:12px; box-shadow:var(--shadow); border:1px solid var(--border);
    cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    transition:transform .15s;
  }
  .section-btn:active { transform:scale(.98); }
  .section-btn h2 { margin:0; font-size:17px; font-weight:700; }
  .arrow { color:var(--muted); font-size:22px; }
  .group-list, .ex-select-list { display:flex; flex-direction:column; gap:10px; }
  .group-item, .ex-item {
    background:var(--card); border-radius:var(--radius); padding:16px;
    box-shadow:var(--shadow); border:1px solid var(--border);
    cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    font-weight:600; transition:transform .15s;
  }
  .group-item:active, .ex-item:active { transform:scale(.98); }
  table {
    width:100%; border-collapse:separate; border-spacing:0;
    background:var(--card); border-radius:var(--radius); overflow:hidden;
    box-shadow:var(--shadow); font-size:14px; border:1px solid var(--border); margin-bottom:12px;
  }
  th, td { padding:12px 6px; text-align:center; border-bottom:1px solid var(--border); }
  th { background:rgba(0,0,0,.02); font-size:12px; font-weight:600; color:var(--muted); }
  td:first-child { text-align:left; padding-left:14px; font-weight:500; }
  tr:last-child td { border-bottom:none; }
  td.editable { cursor:pointer; min-width:50px; }
  td.editable:active { background:rgba(212,168,83,.12); }
  .del-btn {
    color:#e74c3c; font-size:18px; cursor:pointer; padding:4px 8px;
    opacity:.6; transition:opacity .15s;
  }
  .del-btn:active { opacity:1; }
  .add-btn {
    width:100%; background:var(--card); border:2px dashed var(--border);
    border-radius:var(--radius); padding:16px; font-size:15px; font-weight:600;
    color:var(--accent); cursor:pointer; margin-top:8px; transition:all .15s;
  }
  .add-btn:active { transform:scale(.98); background:rgba(212,168,83,.05); }
  .modal {
    position:fixed; inset:0; background:rgba(0,0,0,.5);
    display:none; align-items:center; justify-content:center; z-index:100;
  }
  .modal.show { display:flex; }
  .modal-box {
    background:var(--card); border-radius:24px; padding:24px;
    width:90%; max-width:320px; box-shadow:0 12px 40px rgba(0,0,0,.25);
  }
  .modal-box h3 { margin-bottom:18px; font-size:18px; text-align:center; }
  .num-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .num-btn {
    aspect-ratio:1; background:var(--bg); border:1px solid var(--border);
    border-radius:14px; font-size:22px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .num-btn:active { transform:scale(.9); background:var(--accent); color:#fff; }
  .calendar {
    background:var(--card); border-radius:var(--radius); padding:16px;
    box-shadow:var(--shadow); border:1px solid var(--border);
  }
  .cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .cal-header button {
    background:none; border:none; font-size:22px; color:var(--accent);
    cursor:pointer; padding:6px 14px; font-weight:700;
  }
  .cal-title { font-weight:700; font-size:17px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center; }
  .cal-day-name { font-size:11px; color:var(--muted); font-weight:600; padding:8px 0; }
  .cal-day {
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:12px; font-size:15px; font-weight:500; cursor:pointer; transition:all .15s;
  }
  .cal-day:active { transform:scale(.88); }
  .cal-day.other { color:var(--muted); opacity:.35; }
  .cal-day.today { background:var(--accent); color:#fff; font-weight:700; }
  .cal-day.has-data { background:rgba(212,168,83,.2); }
  .cal-day.today.has-data { background:var(--accent); }
  .theme-bar {
    position:fixed; bottom:0; left:0; right:0; background:var(--card);
    border-top:1px solid var(--border); padding:14px 16px;
    display:flex; gap:10px; justify-content:center;
    max-width:480px; margin:0 auto; box-shadow:0 -4px 20px rgba(0,0,0,.06);
  }
  .theme-btn {
    width:40px; height:40px; border-radius:12px; border:2.5px solid transparent;
    cursor:pointer; transition:transform .15s;
  }
  .theme-btn:active { transform:scale(.88); }
  .theme-btn.active { border-color:var(--accent); }
  .t-light { background:#f7f4ee; } .t-dark { background:#0d1117; }
  .t-alpine { background:#f0f5f9; } .t-cozy { background:#faf6f2; } .t-minimal { background:#0a0a0a; }
</style>
</head>
<body>

<div class="screen active" id="main">
  <h1 id="main-title">ДЕНЬ</h1>
  <div class="cards">
    <div class="stat-card water">
      <div class="stat-label">Вода</div>
      <div class="glasses" id="glasses">
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
      </div>
    </div>
    <div class="stat-card small" onclick="openSleep()">
      <div class="stat-label">Сон</div>
      <div class="sleep-display" id="sleep">—</div>
    </div>
    <div class="stat-card small">
      <div class="stat-label">Настроение</div>
      <div class="stars-display" id="mood">
        <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
      </div>
    </div>
  </div>
  <div class="section-btn" onclick="showScreen('calendar')">
    <h2>Календарь</h2>
    <span class="arrow">›</span>
  </div>
  <div class="section-btn" onclick="showScreen('workout')">
    <h2>Тренировка</h2>
    <span class="arrow">›</span>
  </div>
  <div class="section-btn" onclick="showScreen('food')">
    <h2>Приёмы пищи</h2>
    <span class="arrow">›</span>
  </div>
</div>

<div class="screen" id="calendar">
  <div class="back" onclick="showScreen('main')">‹ Назад</div>
  <h1>Календарь</h1>
  <div class="calendar">
    <div class="cal-header">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="cal-title" id="cal-title"></div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<div class="screen" id="workout">
  <div class="back" onclick="showScreen('main')">‹ Назад</div>
  <h1>Тренировка</h1>
  <div id="workout-table"></div>
  <button class="add-btn" onclick="showScreen('groups')">+ Добавить упражнение</button>
</div>

<div class="screen" id="groups">
  <div class="back" onclick="showScreen('workout')">‹ Назад</div>
  <h1>Группа мышц</h1>
  <div class="group-list" id="group-list"></div>
</div>

<div class="screen" id="exercises">
  <div class="back" onclick="showScreen('groups')">‹ Назад</div>
  <h1 id="ex-group-title">Упражнения</h1>
  <div class="ex-select-list" id="ex-select-list"></div>
</div>

<div class="screen" id="food">
  <div class="back" onclick="showScreen('main')">‹ Назад</div>
  <h1>Приёмы пищи</h1>
  <div id="food-list"></div>
  <button class="add-btn" onclick="addFood()">+ Добавить приём</button>
</div>

<div class="modal" id="sleep-modal">
  <div class="modal-box">
    <h3>Сколько часов сна?</h3>
    <div class="num-grid" id="sleep-nums"></div>
  </div>
</div>

<div class="theme-bar">
  <div class="theme-btn t-light active" data-t=""></div>
  <div class="theme-btn t-dark" data-t="dark"></div>
  <div class="theme-btn t-alpine" data-t="alpine"></div>
  <div class="theme-btn t-cozy" data-t="cozy"></div>
  <div class="theme-btn t-minimal" data-t="minimal"></div>
</div>

<script>
  let currentDate = new Date().toISOString().slice(0,10);
  let calYear = new Date().getFullYear();
  let calMonth = new Date().getMonth();
  let currentGroup = '';

  const exerciseGroups = {
    'Руки': ['Бицепс (штанга)', 'Бицепс руки', 'Трицепс', 'Молотки на бицепс'],
    'Спина': ['Тяга горизонтальная', 'Тяга вертикальная', 'Тяга в наклоне', 'Подтягивания'],
    'Ноги': ['Бицепс бедро', 'Приседания', 'Выпады', 'Икроножная', 'Разгибание сидя'],
    'Грудь': ['Жим лёжа', 'Жим сидя', 'Разводка', 'Отжимания'],
    'Плечи': ['Жим над головой', 'Махи в стороны', 'Подъём штанги к подбородку']
  };

  function getData(date) {
    const all = JSON.parse(localStorage.getItem('tracker') || '{}');
    return all[date] || { water:0, sleep:null, mood:5, foods:[], exercises:[] };
  }
  function saveData(date, data) {
    const all = JSON.parse(localStorage.getItem('tracker') || '{}');
    all[date] = data;
    localStorage.setItem('tracker', JSON.stringify(all));
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'calendar') renderCalendar();
    if (id === 'workout') renderWorkout();
    if (id === 'groups') renderGroups();
    if (id === 'food') renderFood();
    if (id === 'main') loadMain();
  }

  function loadMain() {
    const d = getData(currentDate);
    const [y,m,day] = currentDate.split('-');
    const weekdays = ['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
    const dt = new Date(currentDate);
    document.getElementById('main-title').textContent = `ДЕНЬ — ${day}.${m}.${y} (${weekdays[dt.getDay()]})`;
    document.querySelectorAll('.glass').forEach((g,i) => g.classList.toggle('full', i < d.water));
    document.getElementById('sleep').textContent = d.sleep || '—';
    document.querySelectorAll('#mood span').forEach((s,i) => s.classList.toggle('on', i < (d.mood||5)));
  }

  document.querySelectorAll('.glass').forEach((g, i) => {
    g.onclick = () => {
      const d = getData(currentDate);
      d.water = g.classList.contains('full') ? i : i + 1;
      saveData(currentDate, d);
      loadMain();
    };
  });

  document.querySelectorAll('#mood span').forEach((s, i) => {
    s.onclick = (e) => {
      e.stopPropagation();
      const d = getData(currentDate);
      d.mood = i + 1;
      saveData(currentDate, d);
      loadMain();
    };
  });

  const sleepModal = document.getElementById('sleep-modal');
  const sleepNums = document.getElementById('sleep-nums');
  for (let i = 1; i <= 10; i++) {
    const b = document.createElement('div');
    b.className = 'num-btn';
    b.textContent = i;
    b.onclick = () => {
      const d = getData(currentDate);
      d.sleep = i;
      saveData(currentDate, d);
      sleepModal.classList.remove('show');
      loadMain();
    };
    sleepNums.appendChild(b);
  }
  function openSleep() { sleepModal.classList.add('show'); }
  sleepModal.onclick = (e) => { if (e.target === sleepModal) sleepModal.classList.remove('show'); };

  function changeMonth(delta) {
    calMonth += delta;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  }
  function renderCalendar() {
    const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    document.getElementById('cal-title').textContent = `${months[calMonth]} ${calYear}`;
    const first = new Date(calYear, calMonth, 1).getDay();
    const days = new Date(calYear, calMonth + 1, 0).getDate();
    const start = first === 0 ? 6 : first - 1;
    const allData = JSON.parse(localStorage.getItem('tracker') || '{}');
    const today = new Date().toISOString().slice(0,10);
    let html = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d => `<div class="cal-day-name">${d}</div>`).join('');
    for (let i = 0; i < start; i++) html += '<div class="cal-day other"></div>';
    for (let d = 1; d <= days; d++) {
      const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const has = allData[dateStr] && (allData[dateStr].water || allData[dateStr].sleep || allData[dateStr].foods?.length || allData[dateStr].exercises?.length);
      const isToday = dateStr === today;
      html += `<div class="cal-day ${isToday?'today':''} ${has?'has-data':''}" onclick="selectDate('${dateStr}')">${d}</div>`;
    }
    document.getElementById('cal-grid').innerHTML = html;
  }
  function selectDate(date) {
    currentDate = date;
    showScreen('main');
  }

  function renderGroups() {
    let html = '';
    Object.keys(exerciseGroups).forEach(group => {
      html += `<div class="group-item" onclick="openGroup('${group}')">${group}<span class="arrow">›</span></div>`;
    });
    document.getElementById('group-list').innerHTML = html;
  }

  function openGroup(group) {
    currentGroup = group;
    document.getElementById('ex-group-title').textContent = group;
    const list = exerciseGroups[group];
    let html = '';
    list.forEach(name => {
      html += `<div class="ex-item" onclick="addExercise('${name}')">${name}</div>`;
    });
    document.getElementById('ex-select-list').innerHTML = html;
    showScreen('exercises');
  }

  function addExercise(name) {
    const d = getData(currentDate);
    if (!d.exercises) d.exercises = [];
    if (!d.exercises.find(e => e.name === name)) {
      d.exercises.push({ name, sets: ['', '', ''] });
      saveData(currentDate, d);
    }
    showScreen('workout');
  }

  function renderWorkout() {
    const d = getData(currentDate);
    const exercises = d.exercises || [];
    if (exercises.length === 0) {
      document.getElementById('workout-table').innerHTML = '<p style="color:var(--muted);text-align:center;padding:24px">Нет упражнений</p>';
      return;
    }
    let html = '<table><tr><th>Упражнение</th><th>1</th><th>2</th><th>3</th><th></th></tr>';
    exercises.forEach((ex, i) => {
      html += `<tr><td class="editable" onclick="editExerciseName(${i})">${ex.name}</td>`;
      ex.sets.forEach((s, si) => {
        html += `<td class="editable" onclick="editSet(${i},${si})">${s || '—'}</td>`;
      });
      html += `<td class="del-btn" onclick="deleteExercise(${i})">×</td></tr>`;
    });
    html += '</table>';
    document.getElementById('workout-table').innerHTML = html;
  }

  function deleteExercise(idx) {
    if (!confirm('Удалить упражнение?')) return;
    const d = getData(currentDate);
    d.exercises.splice(idx, 1);
    saveData(currentDate, d);
    renderWorkout();
  }

  function editSet(exIdx, setIdx) {
    const d = getData(currentDate);
    const current = d.exercises[exIdx].sets[setIdx] || '';
    const val = prompt('Вес/повторы (например 25/8)', current);
    if (val !== null) {
      d.exercises[exIdx].sets[setIdx] = val;
      saveData(currentDate, d);
      renderWorkout();
    }
  }

  function editExerciseName(idx) {
    const d = getData(currentDate);
    const val = prompt('Название упражнения', d.exercises[idx].name);
    if (val !== null && val.trim()) {
      d.exercises[idx].name = val;
      saveData(currentDate, d);
      renderWorkout();
    }
  }

  function renderFood() {
    const d = getData(currentDate);
    const foods = d.foods || [];
    if (foods.length === 0) {
      document.getElementById('food-list').innerHTML = '<p style="color:var(--muted);text-align:center;padding:24px">Нет записей</p>';
      return;
    }
    let html = '<table><tr><th>Время</th><th>Рацион</th><th>Ккал</th><th></th></tr>';
    foods.forEach((f, i) => {
      html += `<tr>
        <td class="editable" onclick="editFood(${i},'time')">${f.time}</td>
        <td class="editable" onclick="editFood(${i},'name')">${f.name}</td>
        <td class="editable" onclick="editFood(${i},'kcal')">${f.kcal || '—'}</td>
        <td class="del-btn" onclick="deleteFood(${i})">×</td>
      </tr>`;
    });
    html += '</table>';
    document.getElementById('food-list').innerHTML = html;
  }

  function deleteFood(idx) {
    if (!confirm('Удалить приём пищи?')) return;
    const d = getData(currentDate);
    d.foods.splice(idx, 1);
    saveData(currentDate, d);
    renderFood();
  }

  function editFood(idx, field) {
    const d = getData(currentDate);
    const f = d.foods[idx];
    const labels = { time:'Время', name:'Что съел', kcal:'Калории' };
    const val = prompt(labels[field], f[field] || '');
    if (val !== null) {
      f[field] = val;
      saveData(currentDate, d);
      renderFood();
    }
  }

  function addFood() {
    const name = prompt('Что съел?');
    if (!name) return;
    const time = prompt('Время', new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}));
    if (!time) return;
    const kcal = prompt('Калории (необязательно)', '') || '';
    const d = getData(currentDate);
    if (!d.foods) d.foods = [];
    d.foods.push({ time, name, kcal });
    saveData(currentDate, d);
    renderFood();
  }

  const themeBtns = document.querySelectorAll('.theme-btn');
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtns.forEach(b => b.classList.toggle('active', b.dataset.t === t));
    localStorage.setItem('theme', t);
  }
  themeBtns.forEach(b => b.onclick = () => setTheme(b.dataset.t));
  setTheme(localStorage.getItem('theme') || '');

  loadMain();
</script>
</body>
</html>
