<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>День — Трекер</title>
<style>
  :root {
    --bg: #f5f2eb; --card: #ffffff; --text: #1a1a1a; --muted: #6b6b6b;
    --accent: #c9a227; --border: #e8e4dc; --water: #4aa3df; --water-empty: #e8eef3;
    --radius: 18px; --shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  [data-theme="dark"] {
    --bg: #0f1419; --card: #1a2129; --text: #e8eaed; --muted: #9aa0a6;
    --accent: #f4c542; --border: #2d3741; --water: #3d8fd1; --water-empty: #2a3540;
    --shadow: 0 2px 12px rgba(0,0,0,.3);
  }
  [data-theme="alpine"] {
    --bg: #eef4f8; --card: #ffffff; --text: #1c2834; --muted: #5a6b7a;
    --accent: #6b8e9f; --border: #dce6ed; --water: #5ba3c9; --water-empty: #e4eef5;
  }
  [data-theme="cozy"] {
    --bg: #f7f3ee; --card: #fffdfb; --text: #3d2f24; --muted: #8a7565;
    --accent: #b8956c; --border: #eadfd4; --water: #6aa8c8; --water-empty: #f0e8e0;
  }
  [data-theme="minimal"] {
    --bg: #111111; --card: #1c1c1c; --text: #f5f5f5; --muted: #888;
    --accent: #fff; --border: #2a2a2a; --water: #4a9eff; --water-empty: #252525;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px; padding-bottom:90px; max-width:480px; margin:0 auto;
    min-height:100vh; transition:background .3s, color .3s;
  }
  .screen { display:none; }
  .screen.active { display:block; }
  h1 { font-size:22px; font-weight:700; margin-bottom:16px; letter-spacing:-.3px; }
  .back {
    display:inline-flex; align-items:center; gap:6px; color:var(--accent);
    font-weight:600; margin-bottom:14px; cursor:pointer; font-size:15px;
  }
  .cards { display:flex; gap:10px; margin-bottom:18px; }
  .card {
    background:var(--card); border-radius:var(--radius); padding:14px;
    box-shadow:var(--shadow); border:1px solid var(--border); transition:all .2s;
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .card.water { aspect-ratio:auto; flex:1.6; }
  .card.small { flex:1; cursor:pointer; }
  .card.small:active { transform:scale(.97); }
  .label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; font-weight:600; }
  .glasses { display:flex; gap:5px; flex-wrap:wrap; justify-content:center; }
  .glass {
    width:26px; height:38px; border:2px solid var(--water);
    border-radius:4px 4px 10px 10px; position:relative; overflow:hidden;
    cursor:pointer; background:var(--water-empty); transition:all .2s;
  }
  .glass .fill {
    position:absolute; bottom:0; left:0; right:0; height:0%;
    background:linear-gradient(to top, var(--water), #7ec8f0); transition:height .3s ease;
  }
  .glass.full .fill { height:85%; }
  .glass:active { transform:scale(.92); }
  .sleep-val { font-size:32px; font-weight:700; }
  .stars { font-size:20px; letter-spacing:1px; cursor:pointer; }
  .stars span { opacity:.3; transition:opacity .15s; }
  .stars span.on { opacity:1; }
  .section-btn {
    background:var(--card); border-radius:var(--radius); padding:16px;
    margin-bottom:12px; box-shadow:var(--shadow); border:1px solid var(--border);
    cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    transition:transform .15s;
  }
  .section-btn:active { transform:scale(.98); }
  .section-btn h2 { margin:0; font-size:16px; font-weight:700; }
  .arrow { color:var(--muted); font-size:20px; }
  .group-list, .ex-select-list { display:flex; flex-direction:column; gap:10px; }
  .group-item, .ex-item {
    background:var(--card); border-radius:var(--radius); padding:16px;
    box-shadow:var(--shadow); border:1px solid var(--border);
    cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    font-weight:600; transition:transform .15s;
  }
  .group-item:active, .ex-item:active { transform:scale(.98); }
  table {
    width:100%; border-collapse:separate; border-spacing:0;
    background:var(--card); border-radius:var(--radius); overflow:hidden;
    box-shadow:var(--shadow); font-size:14px; border:1px solid var(--border); margin-bottom:12px;
  }
  th, td { padding:10px 6px; text-align:center; border-bottom:1px solid var(--border); }
  th { background:rgba(0,0,0,.03); font-size:12px; font-weight:600; color:var(--muted); }
  td:first-child { text-align:left; padding-left:12px; font-weight:500; }
  tr:last-child td { border-bottom:none; }
  td.editable { cursor:pointer; min-width:50px; }
  td.editable:hover { background:rgba(201,162,39,.1); }
  .add-btn {
    width:100%; background:var(--card); border:1.5px dashed var(--border);
    border-radius:var(--radius); padding:14px; font-size:15px; font-weight:600;
    color:var(--accent); cursor:pointer; margin-top:8px; transition:all .15s;
  }
  .add-btn:active { transform:scale(.98); }
  .modal {
    position:fixed; inset:0; background:rgba(0,0,0,.45);
    display:none; align-items:center; justify-content:center; z-index:100;
  }
  .modal.show { display:flex; }
  .modal-box {
    background:var(--card); border-radius:20px; padding:20px;
    width:90%; max-width:320px; box-shadow:0 8px 32px rgba(0,0,0,.2);
  }
  .modal-box h3 { margin-bottom:16px; font-size:18px; }
  .num-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .num-btn {
    aspect-ratio:1; background:var(--bg); border:1px solid var(--border);
    border-radius:12px; font-size:20px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .num-btn:active { transform:scale(.92); }
  .calendar {
    background:var(--card); border-radius:var(--radius); padding:14px;
    box-shadow:var(--shadow); border:1px solid var(--border);
  }
  .cal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .cal-header button {
    background:none; border:none; font-size:20px; color:var(--accent);
    cursor:pointer; padding:4px 12px; font-weight:700;
  }
  .cal-title { font-weight:700; font-size:16px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center; }
  .cal-day-name { font-size:11px; color:var(--muted); font-weight:600; padding:6px 0; }
  .cal-day {
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:10px; font-size:14px; font-weight:500; cursor:pointer; transition:all .15s;
  }
  .cal-day:active { transform:scale(.9); }
  .cal-day.other { color:var(--muted); opacity:.4; }
  .cal-day.today { background:var(--accent); color:#fff; }
  .cal-day.has-data { background:rgba(201,162,39,.25); }
  .cal-day.today.has-data { background:var(--accent); }
  .theme-bar {
    position:fixed; bottom:0; left:0; right:0; background:var(--card);
    border-top:1px solid var(--border); padding:12px 16px;
    display:flex; gap:8px; justify-content:center;
    max-width:480px; margin:0 auto; box-shadow:0 -2px 12px rgba(0,0,0,.08);
  }
  .theme-btn {
    width:36px; height:36px; border-radius:10px; border:2px solid transparent;
    cursor:pointer; transition:transform .15s;
  }
  .theme-btn:active { transform:scale(.9); }
  .theme-btn.active { border-color:var(--accent); }
  .t-light { background:#f5f2eb; } .t-dark { background:#0f1419; }
  .t-alpine { background:#eef4f8; } .t-cozy { background:#f7f3ee; } .t-minimal { background:#111; }
</style>
</head>
<body>

<div class="screen active" id="main">
  <h1 id="main-title">ДЕНЬ</h1>
  <div class="cards">
    <div class="card water">
      <div class="label">Вода</div>
      <div class="glasses" id="glasses">
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
        <div class="glass"><div class="fill"></div></div>
      </div>
    </div>
    <div class="card small" onclick="openSleep()">
      <div class="label">Сон</div>
      <div class="sleep-val" id="sleep">—</div>
    </div>
    <div class="card small">
      <div class="label">Настроение</div>
      <div class="stars" id="mood">
        <span>★</span><span>★</span><span>★</span><span>★</span><span>★</span>
      </div>
    </div>
  </div>
  <div class="section-btn" onclick="showScreen('calendar')">
    <h2>Календарь</h2>
    <span class="arrow">›</span>
  </div>
  <div class="section-btn" onclick="showScreen('workout')">
    <h2>Тренировка</h2>
    <span class="arrow">›</span>
  </div>
  <div class="section-btn" onclick="showScreen('food')">
    <h2>Приёмы пищи</h2>
    <span class="arrow">›</span>
  </div>
</div>

<div class="screen" id="calendar">
  <div class="back" onclick="showScreen('main')">‹ Назад</div>
  <h1>Календарь</h1>
  <div class="calendar">
    <div class="cal-header">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="cal-title" id="cal-title"></div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<div class="screen" id="workout">
  <div class="back" onclick="showScreen('main')">‹ Назад</div>
  <h1>Тренировка</h1>
  <div id="workout-table"></div>
  <button class="add-btn" onclick="showScreen('groups')">+ Добавить упражнение</button>
</div>

<div class="screen" id="groups">
  <div class="back" onclick="showScreen('workout')">‹ Назад</div>
  <h1>Группа мышц</h1>
  <div class="group-list" id="group-list"></div>
</div>

<div class="screen" id="exercises">
  <div class="back" onclick="showScreen('groups')">‹ Назад</div>
  <h1 id="ex-group-title">Упражнения</h1>
  <div class="ex-select-list" id="ex-select-list"></div>
</div>

<div class="screen" id="food">
  <div class="back" onclick="showScreen('main')">‹ Назад</div>
  <h1>Приёмы пищи</h1>
  <div id="food-list"></div>
  <button class="add-btn" onclick="addFood()">+ Добавить приём</button>
</div>

<div class="modal" id="sleep-modal">
  <div class="modal-box">
    <h3>Сколько часов сна?</h3>
    <div class="num-grid" id="sleep-nums"></div>
  </div>
</div>

<div class="theme-bar">
  <div class="theme-btn t-light active" data-t=""></div>
  <div class="theme-btn t-dark" data-t="dark"></div>
  <div class="theme-btn t-alpine" data-t="alpine"></div>
  <div class="theme-btn t-cozy" data-t="cozy"></div>
  <div class="theme-btn t-minimal" data-t="minimal"></div>
</div>

<script>
  let currentDate = new Date().toISOString().slice(0,10);
  let calYear = new Date().getFullYear();
  let calMonth = new Date().getMonth();
  let currentGroup = '';

  const exerciseGroups = {
    'Руки': ['Бицепс (штанга)', 'Бицепс руки', 'Трицепс', 'Молотки на бицепс'],
    'Спина': ['Тяга горизонтальная', 'Тяга вертикальная', 'Тяга в наклоне', 'Подтягивания'],
    'Ноги': ['Бицепс бедро', 'Приседания', 'Выпады', 'Икроножная', 'Разгибание сидя'],
    'Грудь': ['Жим лёжа', 'Жим сидя', 'Разводка', 'Отжимания'],
    'Плечи': ['Жим над головой', 'Махи в стороны', 'Подъём штанги к подбородку']
  };

  function getData(date) {
    const all = JSON.parse(localStorage.getItem('tracker') || '{}');
    return all[date] || { water:0, sleep:null, mood:5, foods:[], exercises:[] };
  }
  function saveData(date, data) {
    const all = JSON.parse(localStorage.getItem('tracker') || '{}');
    all[date] = data;
    localStorage.setItem('tracker', JSON.stringify(all));
  }

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'calendar') renderCalendar();
    if (id === 'workout') renderWorkout();
    if (id === 'groups') renderGroups();
    if (id === 'food') renderFood();
    if (id === 'main') loadMain();
  }

  function loadMain() {
    const d = getData(currentDate);
    const [y,m,day] = currentDate.split('-');
    const weekdays = ['ВС','ПН','ВТ','СР','ЧТ','ПТ','СБ'];
    const dt = new Date(currentDate);
    document.getElementById('main-title').textContent = `ДЕНЬ — ${day}.${m}.${y} (${weekdays[dt.getDay()]})`;
    document.querySelectorAll('.glass').forEach((g,i) => g.classList.toggle('full', i < d.water));
    document.getElementById('sleep').textContent = d.sleep || '—';
    document.querySelectorAll('#mood span').forEach((s,i) => s.classList.toggle('on', i < (d.mood||5)));
  }

  document.querySelectorAll('.glass').forEach((g, i) => {
    g.onclick = () => {
      const d = getData(currentDate);
      d.water = g.classList.contains('full') ? i : i + 1;
      saveData(currentDate, d);
      loadMain();
    };
  });

  document.querySelectorAll('#mood span').forEach((s, i) => {
    s.onclick = (e) => {
      e.stopPropagation();
      const d = getData(currentDate);
      d.mood = i + 1;
      saveData(currentDate, d);
      loadMain();
    };
  });

  const sleepModal = document.getElementById('sleep-modal');
  const sleepNums = document.getElementById('sleep-nums');
  for (let i = 1; i <= 10; i++) {
    const b = document.createElement('div');
    b.className = 'num-btn';
    b.textContent = i;
    b.onclick = () => {
      const d = getData(currentDate);
      d.sleep = i;
      saveData(currentDate, d);
      sleepModal.classList.remove('show');
      loadMain();
    };
    sleepNums.appendChild(b);
  }
  function openSleep() { sleepModal.classList.add('show'); }
  sleepModal.onclick = (e) => { if (e.target === sleepModal) sleepModal.classList.remove('show'); };

  function changeMonth(delta) {
    calMonth += delta;
    if (calMonth > 11) { calMonth = 0; calYear++; }
    if (calMonth < 0) { calMonth = 11; calYear--; }
    renderCalendar();
  }
  function renderCalendar() {
    const months = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
    document.getElementById('cal-title').textContent = `${months[calMonth]} ${calYear}`;
    const first = new Date(calYear, calMonth, 1).getDay();
    const days = new Date(calYear, calMonth + 1, 0).getDate();
    const start = first === 0 ? 6 : first - 1;
    const allData = JSON.parse(localStorage.getItem('tracker') || '{}');
    const today = new Date().toISOString().slice(0,10);
    let html = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d => `<div class="cal-day-name">${d}</div>`).join('');
    for (let i = 0; i < start; i++) html += '<div class="cal-day other"></div>';
    for (let d = 1; d <= days; d++) {
      const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const has = allData[dateStr] && (allData[dateStr].water || allData[dateStr].sleep || allData[dateStr].foods?.length || allData[dateStr].exercises?.length);
      const isToday = dateStr === today;
      html += `<div class="cal-day ${isToday?'today':''} ${has?'has-data':''}" onclick="selectDate('${dateStr}')">${d}</div>`;
    }
    document.getElementById('cal-grid').innerHTML = html;
  }
  function selectDate(date) {
    currentDate = date;
    showScreen('main');
  }

  function renderGroups() {
    let html = '';
    Object.keys(exerciseGroups).forEach(group => {
      html += `<div class="group-item" onclick="openGroup('${group}')">${group}<span class="arrow">›</span></div>`;
    });
    document.getElementById('group-list').innerHTML = html;
  }

  function openGroup(group) {
    currentGroup = group;
    document.getElementById('ex-group-title').textContent = group;
    const list = exerciseGroups[group];
    let html = '';
    list.forEach(name => {
      html += `<div class="ex-item" onclick="addExercise('${name}')">${name}</div>`;
    });
    document.getElementById('ex-select-list').innerHTML = html;
    showScreen('exercises');
  }

  function addExercise(name) {
    const d = getData(currentDate);
    if (!d.exercises) d.exercises = [];
    if (!d.exercises.find(e => e.name === name)) {
      d.exercises.push({ name, sets: ['', '', ''] });
      saveData(currentDate, d);
    }
    showScreen('workout');
  }

  function renderWorkout() {
    const d = getData(currentDate);
    const exercises = d.exercises || [];
    if (exercises.length === 0) {
      document.getElementById('workout-table').innerHTML = '<p style="color:var(--muted);text-align:center;padding:20px">Нет упражнений</p>';
      return;
    }
    let html = '<table><tr><th>Упражнение</th><th>1</th><th>2</th><th>3</th></tr>';
    exercises.forEach((ex, i) => {
      html += `<tr><td class="editable" onclick="editExerciseName(${i})">${ex.name}</td>`;
      ex.sets.forEach((s, si) => {
        html += `<td class="editable" onclick="editSet(${i},${si})">${s || '—'}</td>`;
      });
      html += '</tr>';
    });
    html += '</table>';
    document.getElementById('workout-table').innerHTML = html;
  }

  function editSet(exIdx, setIdx) {
    const d = getData(currentDate);
    const current = d.exercises[exIdx].sets[setIdx] || '';
    const val = prompt('Вес/повторы (например 25/8)', current);
    if (val !== null) {
      d.exercises[exIdx].sets[setIdx] = val;
      saveData(currentDate, d);
      renderWorkout();
    }
  }

  function editExerciseName(idx) {
    const d = getData(currentDate);
    const val = prompt('Название упражнения', d.exercises[idx].name);
    if (val !== null && val.trim()) {
      d.exercises[idx].name = val;
      saveData(currentDate, d);
      renderWorkout();
    }
  }

  function renderFood() {
    const d = getData(currentDate);
    const foods = d.foods || [];
    let html = '<table><tr><th>Время</th><th>Рацион</th><th>Ккал</th></tr>';
    foods.forEach((f, i) => {
      html += `<tr>
        <td class="editable" onclick="editFood(${i},'time')">${f.time}</td>
        <td class="editable" onclick="editFood(${i},'name')">${f.name}</td>
        <td class="editable" onclick="editFood(${i},'kcal')">${f.kcal || '—'}</td>
      </tr>`;
    });
    html += '</table>';
    document.getElementById('food-list').innerHTML = html;
  }

  function editFood(idx, field) {
    const d = getData(currentDate);
    const f = d.foods[idx];
    const labels = { time:'Время', name:'Что съел', kcal:'Калории' };
    const val = prompt(labels[field], f[field] || '');
    if (val !== null) {
      f[field] = val;
      saveData(currentDate, d);
      renderFood();
    }
  }

  function addFood() {
    const name = prompt('Что съел?');
    if (!name) return;
    const time = prompt('Время', new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'}));
    if (!time) return;
    const kcal = prompt('Калории (необязательно)', '') || '';
    const d = getData(currentDate);
    if (!d.foods) d.foods = [];
    d.foods.push({ time, name, kcal });
    saveData(currentDate, d);
    renderFood();
  }

  const themeBtns = document.querySelectorAll('.theme-btn');
  function setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtns.forEach(b => b.classList.toggle('active', b.dataset.t === t));
    localStorage.setItem('theme', t);
  }
  themeBtns.forEach(b => b.onclick = () => setTheme(b.dataset.t));
  setTheme(localStorage.getItem('theme') || '');

  loadMain();
</script>
</body>
</html>
